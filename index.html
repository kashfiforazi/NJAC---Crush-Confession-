<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NJAC - Crush & Confession</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader-wrapper {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          width: 100vw;
          background-color: #0f172a; /* matches a dark slate for a cool default */
          flex-direction: column;
          gap: 20px;
        }
        .initial-loader {
          width: 64px;
          height: 64px;
          border: 4px solid #334155;
          border-top-color: #f97316; /* primary color */
          border-radius: 50%;
          position: absolute;
          box-sizing: border-box;
          animation: rotation 1s linear infinite;
        }
        .initial-loader-image {
          width: 32px;
          height: 32px;
          object-fit: contain;
          animation: pulse 2s infinite ease-in-out;
        }
        .initial-loader-container {
          position: relative;
          width: 64px;
          height: 64px;
          display: flex;
          justify-content: center;
          align-items: center;
        }
        .initial-loader-logo {
          color: #fff;
          font-family: 'Outfit', sans-serif;
          font-size: 24px;
          font-weight: 800;
          letter-spacing: 1px;
          margin-top: 10px;
        }
        @keyframes rotation {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
          0% { opacity: 0.8; transform: scale(0.95); }
          50% { opacity: 1; transform: scale(1.05); }
          100% { opacity: 0.8; transform: scale(0.95); }
        }
      </style>
      <div class="initial-loader-wrapper">
        <div class="initial-loader-container">
          <div class="initial-loader"></div>
          <img src="https://i.ibb.co/Vckn3C6D/1000032660.png" class="initial-loader-image" alt="NJAC Logo" />
        </div>
        <div class="initial-loader-logo">NJAC <span style="color: #f97316;"> - Crush & Confession</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
